apiVersion: apps/v1
kind: Deployment

metadata:

  # Name of the Kubernetes Deployment resource.
  name: synthetic-generator

  # Namespace used to isolate application resources.
  namespace: radio-platform

spec:

  # Single replica is currently sufficient.
  replicas: 1

  # Number of previous ReplicaSets retained.
  revisionHistoryLimit: 5

  # Deployment update strategy.
  strategy:
    type: RollingUpdate

    rollingUpdate:

      # Create one additional pod during rollout.
      maxSurge: 1

      # Existing pod remains available during upgrade.
      maxUnavailable: 0

  # Deployment manages these matching pods.
  selector:
    matchLabels:
      app: synthetic-generator

  template:

    metadata:

      # Labels assigned to created pods.
      labels:
        app: synthetic-generator

    spec:

      # Service account used for IRSA authentication.
      serviceAccountName: synthetic-generator

      # Allow time for graceful shutdown.
      terminationGracePeriodSeconds: 30

      # Pod security hardening.
      securityContext:

        # Prevent root execution.
        runAsNonRoot: true

        # Explicit runtime user.
        runAsUser: 1000

        # Explicit runtime group.
        runAsGroup: 1000

      # --------------------------------------------------
      # Persistent storage.
      #
      # Generated recordings are written to a persistent
      # volume instead of the container filesystem.
      #
      # This allows failed uploads to survive:
      #
      # - Pod restarts
      # - Rolling deployments
      # - Crash recovery
      # --------------------------------------------------
      volumes:

        - name: generator-storage

          persistentVolumeClaim:
            claimName: generator-storage

      containers:

        - name: synthetic-generator

          # Image stored in Amazon ECR.
          image: 548722508417.dkr.ecr.eu-west-2.amazonaws.com/synthetic-generator:v0.6.2

          # Always pull latest image for tag.
          imagePullPolicy: Always

          ports:

            # Metrics and health endpoints.
            - name: metrics
              containerPort: 8000

          # ------------------------------------------------
          # Persistent recording storage mount.
          #
          # Application writes recordings to:
          #
          # /data/output
          #
          # rather than container-local storage.
          # ------------------------------------------------
          volumeMounts:

            - name: generator-storage
              mountPath: /data

          # Startup probe.
          startupProbe:

            httpGet:
              path: /health/live
              port: 8000

            # Allow:
            # 30 × 5 seconds = 150 seconds startup time
            failureThreshold: 30
            periodSeconds: 5

          # Liveness probe.
          livenessProbe:

            httpGet:
              path: /health/live
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe.
          readinessProbe:

            httpGet:
              path: /health/ready
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Resource governance.
          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi