name: CI

on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ----------------------------------------------------------
  # Detect which areas of the repository changed.
  #
  # This prevents expensive validations from running when
  # unrelated files are modified.
  # ----------------------------------------------------------

  detect-changes:

    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      application: ${{ steps.filter.outputs.application }}
      observability: ${{ steps.filter.outputs.observability }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3

        with:
          filters: |

            terraform:
              - 'terraform/**'

            application:
              - 'app/**'

            observability:
              - 'observability/**'

            kubernetes:
              - 'kubernetes/**'

  # ----------------------------------------------------------
  # Terraform validation.
  #
  # Runs only when Terraform changes.
  #
  # terraform fmt is currently soft-fail so formatting
  # issues don't block merges while the platform matures.
  # ----------------------------------------------------------

  terraform-validation:

    name: Terraform Validation

    runs-on: ubuntu-latest

    needs:
      - detect-changes

    if: needs.detect-changes.outputs.terraform == 'true'

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        continue-on-error: true
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ----------------------------------------------------------
  # Basic Python validation.
  #
  # Verifies syntax before attempting Docker builds.
  # Ruff is soft-fail initially.
  # ----------------------------------------------------------

  python-validation:

    name: Python Validation

    runs-on: ubuntu-latest

    needs:
      - detect-changes

    if: needs.detect-changes.outputs.application == 'true'

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Compile Application
        run: |
          python -m py_compile app/generator.py

      - name: Ruff Linting (Soft Fail)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app/

  # ----------------------------------------------------------
  # Validate stations.yaml.
  #
  # Protects the application from invalid station metadata.
  #
  # This is one of the highest-value validations because
  # station metadata is now becoming a platform contract.
  # ----------------------------------------------------------

  station-config-validation:

    name: Station Configuration Validation

    runs-on: ubuntu-latest

    needs:
      - detect-changes

    if: needs.detect-changes.outputs.application == 'true'

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Validate stations.yaml
        run: |

          python <<'EOF'

          import yaml

          with open(
              "app/stations.yaml",
              "r",
              encoding="utf-8"
          ) as file:

              config = yaml.safe_load(file)

          stations = config.get("stations", [])

          assert stations, (
              "No stations configured."
          )

          required_fields = [
              "id",
              "name",
              "stream_url",
              "country",
              "genre",
              "enabled",
              "segment_duration_seconds"
          ]

          for station in stations:

              missing = [
                  field
                  for field in required_fields
                  if field not in station
              ]

              assert not missing, (
                  f"Station "
                  f"{station.get('id', 'unknown')} "
                  f"missing fields: {missing}"
              )

          print(
              f"Validated {len(stations)} stations."
          )

          EOF

  # ----------------------------------------------------------
  # Validate observability artifacts.
  #
  # Soft-fail initially while alerts and dashboards
  # continue to evolve.
  # ----------------------------------------------------------

  observability-validation:

    name: Observability Validation

    runs-on: ubuntu-latest

    needs:
      - detect-changes

    if: needs.detect-changes.outputs.observability == 'true'

    continue-on-error: true

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate YAML Syntax
        run: |
          python - <<'EOF'
          import yaml

          files = [
              "observability/servicemonitor.yaml",
              "observability/prometheus-rules.yaml"
          ]

          for file in files:
              with open(file, "r") as f:
                  yaml.safe_load(f)

          print("Observability YAML valid")
          EOF

  # ----------------------------------------------------------
  # Docker build validation.
  #
  # Ensures the container image can successfully build.
  # ----------------------------------------------------------

  docker-build:

    name: Docker Build Validation

    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - python-validation
      - station-config-validation

    if: needs.detect-changes.outputs.application == 'true'

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t synthetic-generator:test \
            ./app

  # ----------------------------------------------------------
  # Container startup validation.
  #
  # This would have caught:
  #
  # - Missing Gauge imports
  # - Metadata migration issues
  # - Invalid station loading
  # - Application startup failures
  #
  # before reaching Kubernetes.
  # ----------------------------------------------------------

  container-startup-validation:

    name: Container Startup Validation

    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Container
        run: |
          docker build \
            -t synthetic-generator:test \
            ./app

      - name: Start Container
        run: |
          docker run -d \
            --name synthetic-generator \
            -p 8000:8000 \
            synthetic-generator:test

      - name: Wait For Startup
        run: sleep 15

      - name: Verify Health Endpoint
        run: |
          curl --fail \
            http://localhost:8000/health/live

      - name: Verify Metrics Endpoint
        run: |
          curl --fail \
            http://localhost:8000/metrics

      - name: Verify Business Metrics Exist
        run: |

          curl \
            http://localhost:8000/metrics \
            > metrics.txt

          grep \
            latest_recording_timestamp \
            metrics.txt

  # ----------------------------------------------------------
  # Placeholder for future platform quality gates.
  #
  # These intentionally soft-fail for now.
  # ----------------------------------------------------------

  future-quality-gates:

    name: Future Quality Gates

    runs-on: ubuntu-latest

    continue-on-error: true

    steps:

      - name: Future Roadmap
        run: |
          echo "Future checks:"
          echo "- Unit Tests"
          echo "- Integration Tests"
          echo "- Trivy"
          echo "- Checkov"
          echo "- Bandit"
          echo "- SBOM Generation"
          echo "- Vulnerability Scanning"